name: Verify Veya Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static website checks
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/app.js
          test -f assets/styles.css
          test -f assets/product-shots/student-home.webp
          test -f assets/product-shots/teacher-home.webp
          grep -q 'assets/app.js' index.html
          grep -q 'Learning Evidence' assets/app.js
          grep -q 'Teacher Control Plane' assets/app.js
          grep -q 'Learning Life OS' assets/app.js
          echo 'Veya static website checks passed.'
