name: Verify Veya Website

on:
  push:
    branches:
      - verify/site
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Verify output
        shell: bash
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Veya website production build verified."
